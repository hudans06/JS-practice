<!DOCTYPE html>
<head>
    <title> to do list </title>

        .addBtn {

        width: 25%;
        background: #d9d9d9;
        color: #555;
        float: left;
        text-align: center;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        border-radius: 0;
}
    </style>

</head>
<body>
    <div id="myDIV" class="header">
        <h2>To Do List</h2>
        <input type="text" id="myInput" placeholder="Tulis Tugas... ">
        <span onclick="newElement()" class="addBtn">Tambah</span>
    </div>

    <ul id="myUL">
        <li>Mengerjakan latihan 1</li>
        <li>Membuat laporan</li>
    </ul>
</body>

</html>
