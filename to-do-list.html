<!DOCTYPE html>
<head>
    <title> to do list </title>

</head>
<body>
    <div id="myDIV" class="header">
        <h2>To Do List</h2>
        <input type="text" id="task" placeholder="Tulis Tugas... ">
        <button onclick="addTask()">Tambah</button>
    </div>
    
    <ul id="list">
    </ul>

    <script>
        let tasks = [];

        // Function to Load tasks
        function loadTasks() {
            let saved = localStorage.getItem("tasks");
            if (saved !== null) {
                // Jika ada data di local storage, muat datanya
                tasks = JSON.parse(saved);
                tasks = ["Mengerjakan latihan 1", "Membuat laporan"];
            }
        }

        // Function to Save tasks
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        // Function to Display tasks
        function displayTasks() {
            let html = "";
            for (let i = 0; i < tasks.length; i++) {
                // 2. Perbaikan typo (menghapus titik koma di dalam string tag html)
                html += "<li>" + tasks[i]
            }
            document.getElementById("list").innerHTML = html;
        }

        // Function to Add a task
        function addTask() {
            let taskInput = document.getElementById("task");
            let text = taskInput.value.trim(); // 3. Tambahkan trim() agar input spasi kosong tidak lolos
            
            if (text === "") {
                alert("Tugas tidak boleh kosong!"); // Beri peringatan kecil (opsional)
                return;
            }
            
            tasks.push(text);
            taskInput.value = ""; // Kosongkan input setelah menambah
            saveTasks();
            displayTasks();
        }

        // Load and display tasks when page loads 
        loadTasks();
        displayTasks();
    </script>
</body>

</html>
